const startBox = document.querySelector(".start-box");
const qBox = document.querySelector(".q-box");
const resBox = document.querySelector(".result-box");
const qNum = document.getElementById("qNum");
const qText = document.getElementById("qText");
const optWrap = document.getElementById("optWrap");
const progressBar = document.getElementById("progressBar");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const resName = document.getElementById("resName");
const resSub = document.getElementById("resSub");
const resTag = document.getElementById("resTag");
const resDesc = document.getElementById("resDesc");
const resQuote = document.getElementById("resQuote");
const avatarImg = document.getElementById("avatarImg");

let current = 0;
const totalQ = questions.length;
let answers = Array(totalQ).fill(null);

document.getElementById("startBtn").onclick = ()=>{
  startBox.classList.remove("active");
  qBox.classList.add("active");
  current = 0;
  answers = Array(totalQ).fill(null);
  renderQuestion();
};

function renderQuestion(){
  const item = questions[current];
  qNum.innerText = `第${current+1}题 / 共${totalQ}题`;
  qText.innerText = item.q;
  optWrap.innerHTML = "";
  const pct = (current/totalQ)*100;
  progressBar.style.width = pct + "%";

  item.opts.forEach((opt, idx)=>{
    const btn = document.createElement("button");
    btn.className = "opt";
    if(answers[current] && answers[current].idx === idx){
      btn.classList.add("selected");
    }
    btn.innerText = opt.text;
    btn.onclick = ()=>{
      answers[current] = { T:opt.T, F:opt.F, J:opt.J, P:opt.P, idx };
      renderQuestion();
      setTimeout(()=>{
        if(current < totalQ - 1){
          current++;
          renderQuestion();
        }else{
          calcResult();
        }
      }, 350);
    };
    optWrap.appendChild(btn);
  });

  prevBtn.disabled = current === 0;
  nextBtn.innerText = current === totalQ - 1 ? "查看结果" : "下一题";
}

prevBtn.onclick = ()=>{
  if(current > 0){
    current--;
    renderQuestion();
  }
};

nextBtn.onclick = ()=>{
  if(current < totalQ - 1){
    current++;
    renderQuestion();
  }else{
    calcResult();
  }
};

// 四维欧氏距离匹配算法
function calcResult(){
  let sumT=0, sumF=0, sumJ=0, sumP=0;
  let validCnt = 0;
  for(const a of answers){
    if(a){
      sumT += a.T;
      sumF += a.F;
      sumJ += a.J;
      sumP += a.P;
      validCnt++;
    }
  }
  const avgT = sumT / validCnt;
  const avgF = sumF / validCnt;
  const avgJ = sumJ / validCnt;
  const avgP = sumP / validCnt;

  // 遍历，计算四维距离
  const scored = resultList.map(p=>{
    const dt = p.T - avgT;
    const df = p.F - avgF;
    const dj = p.J - avgJ;
    const dp = p.P - avgP;
    const dist = Math.sqrt(dt*dt + df*df + dj*dj + dp*dp);
    return {...p, dist};
  }).sort((a,b)=>a.dist - b.dist);

  const best = scored[0];
  showResult(best);
}

function showResult(best){
  qBox.classList.remove("active");
  resBox.classList.add("active");
  resName.innerText = best.name;
  resSub.innerText = best.sub || "";
  resTag.innerHTML = best.tags.map(t=>`<span class="result-tag">${t}</span>`).join(" ");
  resDesc.innerText = best.desc;
  resQuote.innerText = `「${best.quote}」`;
  avatarImg.src = best.img;
  avatarImg.style.display = best.img ? "block" : "none";

  document.getElementById("copyShare").onclick = async ()=>{
    const shareTxt = `✨测试结果：我最像【${best.name}】\n标签：${best.tags.join("｜")}\n评价：${best.desc}\n名句：${best.quote}\n来测测你最像哪位历史人物！解锁完整深度报告👉`;
    try{
      await navigator.clipboard.writeText(shareTxt);
      alert("✅分享文案复制成功！");
    }catch(e){
      alert("复制失败，请手动复制");
    }
  }
}

document.getElementById("restartBtn").onclick = ()=>{
  resBox.classList.remove("active");
  startBox.classList.add("active");
};
</script>
